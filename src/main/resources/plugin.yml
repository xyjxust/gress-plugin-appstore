# 应用商店插件清单（与 iam-service/plugin.yml 结构一致：plugin 元数据 + ui + config）
plugin:
  id: appstore
  class: com.keqi.gress.plugin.appstore.AppStorePlugin
  name: 应用商店
  version: 1.1.0
  provider: Gress Team
  description: 应用商店插件，提供应用安装、升级与运维管理能力
  license: MIT
  requires: "*"
  type: APPLICATION

  ui:
    hasWidget: true
    hasPanel: false
    surfaces:
      admin: true
      consumer: false
    autoLoad:
      admin: true
      consumer: false
    menus:
      - id: aggregate-applications
        title: 聚合应用管理
        icon: Layers
        path: /plugins/appstore/aggregate-applications
        component: AggregateApplicationManagement
        order: 49
        apiPrefix: /api/v2/plugins/appstore/applications/aggregates
        operations: [VIEW, MANAGE]

      - id: applications
        title: 应用管理
        icon: Cube
        path: /plugins/appstore/applications
        component: ApplicationManagement
        order: 50
        apiPrefix: /api/v2/plugins/appstore/applications
        operations: [VIEW, MANAGE]

      - id: operation-logs
        title: 操作日志
        icon: DocumentText
        path: /plugins/appstore/operation-logs
        component: OperationLog
        order: 51
        apiPrefix: /api/v2/plugins/appstore/applications/operation-logs
        operations: [VIEW]

      - id: middlewares
        title: 中间件管理
        icon: Server
        path: /plugins/appstore/middlewares
        component: MiddlewareManagement
        order: 52
        apiPrefix: /api/v2/plugins/appstore/middlewares
        operations: [VIEW, MANAGE]

      - id: nodes
        title: 节点管理
        icon: ServerOutline
        path: /plugins/appstore/nodes
        component: NodeManagement
        order: 53
        apiPrefix: /api/v2/plugins/appstore/nodes
        operations: [VIEW, MANAGE]

      - id: stack-deploy
        title: 多套部署
        icon: RocketOutline
        path: /plugins/appstore/stack-deploy
        component: StackDeployment
        order: 54
        apiPrefix: /api/v2/plugins/appstore/stack-deploy
        operations: [VIEW, MANAGE]

      - id: plugin-monitor
        title: 插件监控
        icon: Activity
        path: /plugins/appstore/monitor
        component: PluginMonitorDashboard
        order: 55
        apiPrefix: /api/plugins/appstore/monitor
        operations: [VIEW]

  # 运行时业务配置（绑定到 AppStoreConfig，前缀 appstore；由 PluginManifestConfigExtractor 展平为 appstore.*）
appstore:
      storeName: Gress 应用商店（开发环境）
      storeUrl: http://localhost:8081/

      api:
        baseUrl: http://localhost:8081/gress/plugins/as-admin
        secretKey: ""
        timeout: 30000
        maxRetries: 3
        enabled: true

      download:
        directory: ./downloads/plugins
        timeout: 300000
        maxConcurrent: 3
        autoInstall: false
        autoRetry: true

      sync:
        enabled: false
        interval: 3600
        cron: "0 0 2 * * ?"
        maxRetries: 3

      cache:
        enabled: false
        expireSeconds: 3600
        maxSize: 1000

      security:
        verifySignature: false
        checkSource: false
        allowedSources:
          - http://localhost:8080
          - https://store.gress.io
          - https://plugins.gress.io
        enableSandbox: false

      applicationTypes:
        allowed:
          - WORKFLOW
          - APPLICATION
          - TRIGGER
          - TASK
        defaultType: APPLICATION

      notification:
        enabled: false
        methods:
          - system
        events:
          - application.installed
          - application.upgraded
          - application.uninstalled
          - application.failed

      customProperties:
        feature.new-ui: enabled
        feature.beta-test: enabled
        max-upload-size: 100MB
        max-applications: 100
        default-language: zh-CN
        support-email: support@gress.io
